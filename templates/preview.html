<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ComicCraft AI - Preview</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f4f4;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.panel{
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
    margin-bottom:25px;
}

.panel h2{
    margin-bottom:15px;
}

.image-box{
    width:100%;
    height:300px;
    border:2px dashed #999;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#eee;
    color:#666;
    font-size:22px;
    margin-bottom:20px;
}

.content{
    white-space:pre-wrap;
    line-height:1.8;
    font-size:16px;
}

.buttons{
    text-align:center;
    margin-top:30px;
}

.buttons a{
    text-decoration:none;
    background:#3498db;
    color:white;
    padding:12px 25px;
    border-radius:6px;
}

.buttons a:hover{
    background:#2980b9;
}
</style>

</head>

<body>

<div class="container">

<h1>Comic Preview</h1>

<div class="panel">

<h2>Panel 1</h2>

<div class="image-box">
🖼 Panel 1 Image
</div>

<div class="content">
{{ outline }}
</div>

</div>

<div class="panel">

<h2>Panel 2</h2>

<div class="image-box">
🖼 Panel 2 Image
</div>

<div class="content">
{{ script }}
</div>

</div>

<div class="buttons">
<a href="/">Generate Another</a>
</div>

</div>

</body>
</html>
